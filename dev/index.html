<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ebusd Time Program Card – dev</title>
    <style>
      /* A few HA theme variables (dark) so the card looks like in HA. */
      :root {
        --primary-color: #3fa38f;
        --card-background-color: #1c1c1e;
        --secondary-background-color: #2a2a2d;
        --primary-text-color: #f2f2f2;
        --secondary-text-color: #9a9a9e;
        --divider-color: rgba(255, 255, 255, 0.12);
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0d0e10;
        font-family: system-ui, sans-serif;
        color: #f2f2f2;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .frame { flex: none; }
      .scenarios { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #9a9a9e; }
      .scenarios button { font: inherit; color: #f2f2f2; background: #2a2a2d; border: 1px solid #3a3a3e; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .scenarios button[aria-pressed="true"] { background: #3fa38f; border-color: #3fa38f; color: #fff; }
      .settings { gap: 16px; margin-bottom: -12px; }
      .settings select { font: inherit; color: #f2f2f2; background: #2a2a2d; border: 1px solid #3a3a3e; border-radius: 6px; padding: 3px 6px; }
      .frame h1 { font-size: 12px; color: #9a9a9e; font-weight: 400; margin: 0 0 6px; }
      #narrow { width: 400px; }
      #wide { width: 820px; }
    </style>
  </head>
  <body>
    <div class="frame" id="narrow"><h1>Mobile (400 px)</h1></div>
    <div class="frame" id="wide"><h1>Wide (820 px)</h1></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
