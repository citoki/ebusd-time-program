<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ebusd Time Program Card – dev</title>
    <style>
      /* A few HA theme variables (dark) so the card looks like in HA. */
      :root {
        --primary-color: #3fa38f;
        --card-background-color: #1c1c1e;
        --secondary-background-color: #2a2a2d;
        --primary-text-color: #f2f2f2;
        --secondary-text-color: #9a9a9e;
        --divider-color: rgba(255, 255, 255, 0.12);
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0d0e10;
        font-family: system-ui, sans-serif;
        color: #f2f2f2;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .frame { flex: none; }
      .frame h1 { font-size: 12px; color: #9a9a9e; font-weight: 400; margin: 0 0 6px; }
      #narrow { width: 400px; }
      #wide { width: 820px; }
    </style>
  </head>
  <body>
    <div class="frame" id="narrow"><h1>Mobile (400 px)</h1></div>
    <div class="frame" id="wide"><h1>Wide (820 px)</h1></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
