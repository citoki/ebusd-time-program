name: Validate

on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        - cron: "0 4 * * 1" # weekly, catches new HACS rules
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm
            -   run: npm ci
            -   run: npm run typecheck
            -   run: npm test
            -   run: npm run build

    e2e:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm
            -   run: npm ci
            -   run: npx playwright install --with-deps chromium
            -   run: npm run test:e2e

    hacs:
        runs-on: ubuntu-latest
        steps:
            -   uses: hacs/action@22.5.0
                with:
                    category: plugin
