name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) to build the card
# and create a draft release with ebusd-time-program-card.js attached.
# HACS installs the file from the release once it is published.
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version: 24
                    cache: npm
            -   name: Check tag against package.json
                run: |
                    version="$(node -p 'require("./package.json").version')"
                    if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                        echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                        exit 1
                    fi
            -   run: npm ci
            -   run: npm run typecheck
            -   run: npm test
            -   run: npm run build
            -   name: Release
                uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
                with:
                    draft: true
                    # a tag with a "-" (v0.5.0-beta.1) is a beta: published as pre-release, never "Latest"
                    prerelease: ${{ contains(github.ref_name, '-') }}
                    generate_release_notes: true
                    files: dist/ebusd-time-program-card.js
