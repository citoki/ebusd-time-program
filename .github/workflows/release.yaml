name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) to build the card
# and create a draft release with ebusd-time-program-card.js attached.
# HACS installs the file from the release once it is published.
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm
            -   name: Check tag against package.json
                run: |
                    version="$(node -p 'require("./package.json").version')"
                    if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                        echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                        exit 1
                    fi
            -   run: npm ci
            -   run: npm run typecheck
            -   run: npm test
            -   run: npm run build
            -   name: Release
                uses: softprops/action-gh-release@v3
                with:
                    draft: true
                    # a tag with a "-" (v0.5.0-beta.1) is a beta: published as pre-release, never "Latest"
                    prerelease: ${{ contains(github.ref_name, '-') }}
                    generate_release_notes: true
                    files: dist/ebusd-time-program-card.js
